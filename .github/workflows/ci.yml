name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Backend - Build & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: gestaoferias
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/gestaoferias?schema=public
      JWT_SECRET: ci_test_secret_key_not_for_production
      NODE_ENV: test
      # Test-only key (32 bytes base64). Production usa Docker Secret no Swarm.
      BANK_DATA_ENCRYPTION_KEY: 0+5mYyV8DG7BUSmJ6ugef35NARVs5HJ+TbogSnOD0D4=
      IMPORT_FILE_STORAGE_PATH: /tmp/imports-ci
      IMPORT_RETENTION_DAYS: '90'
      IMPORT_WORKER_CONCURRENCY: '2'
      IMPORT_TENANT_LOCK_TTL_SEC: '960'
      IMPORT_JOB_TIMEOUT_MIN: '15'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Install dependencies
        working-directory: backend-api
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend-api
        run: npx prisma generate

      - name: Run migrations
        working-directory: backend-api
        run: npx prisma migrate deploy

      - name: Build TypeScript
        working-directory: backend-api
        run: npm run build

      - name: Run unit tests
        working-directory: backend-api
        run: npx tsx --test test/modules/*.test.ts

      - name: Run security pen-tests (cross-tenant isolation — Story 5.3)
        working-directory: backend-api
        run: npx tsx --test test/security/*.test.ts

  frontend-build:
    name: Frontend - Build & Lint
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Lint
        working-directory: frontend-web
        run: npm run lint || true

      - name: Run tests
        working-directory: frontend-web
        run: npx vitest run

      - name: Build
        working-directory: frontend-web
        run: npm run build
